<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Exam Checker - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#eff6ff,#eef2ff,#faf5ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:100%;max-width:400px;padding:32px}
.logo{width:56px;height:56px;background:linear-gradient(135deg,#2563eb,#4f46e5);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-size:28px}
h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#374151}
input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:none;transition:border .2s;margin-bottom:16px}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{width:100%;padding:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>Smart Exam Checker</h1>
  <p class="sub">Sign in to your account</p>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@university.edu" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
  </form>
</div>
<script>
const API='https://exam.hiroshi.cloud/api';
const form=document.getElementById('loginForm');
const errorEl=document.getElementById('error');
const successEl=document.getElementById('success');
const submitBtn=document.getElementById('submitBtn');
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  errorEl.style.display='none';
  successEl.style.display='none';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  submitBtn.disabled=true;
  submitBtn.innerHTML='<span class="spinner"></span>Signing in...';
  try{
    const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){errorEl.textContent='❌ '+(data.detail||'Login failed');errorEl.style.display='block';submitBtn.disabled=false;submitBtn.textContent='Sign In';return;}
    if(data.access_token){
      localStorage.setItem('auth-storage',JSON.stringify({state:{token:data.access_token,refreshToken:data.refresh_token,isAuthenticated:true}}));
      const meRes=await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+data.access_token}});
      const userData=await meRes.json();
      localStorage.setItem('auth-storage',JSON.stringify({state:{token:data.access_token,refreshToken:data.refresh_token,isAuthenticated:true,user:userData}}));
      successEl.textContent='✅ Login successful! Redirecting...';
      successEl.style.display='block';
      setTimeout(()=>{window.location.href='/'+(userData.role||'student');},500);
    }
  }catch(err){
    errorEl.textContent='❌ Network error: '+(err.message||'Cannot connect');
    errorEl.style.display='block';
    console.error('Login error:',err);
  }finally{
    if(submitBtn.disabled){submitBtn.disabled=false;submitBtn.textContent='Sign In';}
  }
});
</script>
</body>
</html>
