<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Smart Exam Checker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f9fafb;min-height:100vh}
.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.nav h2{font-size:18px;font-weight:700;color:#1f2937}
.nav-btn{padding:8px 16px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:24px;margin:24px auto;max-width:500px}
h3{font-size:18px;font-weight:600;margin-bottom:4px}
.subtle{color:#6b7280;font-size:13px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:#374151}
input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;transition:border .2s;margin-bottom:14px}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{width:100%;padding:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.msg-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px 20px;color:#6b7280}
.user-info{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f3f4f6}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.user-name{font-weight:600;font-size:16px}
.user-email{color:#6b7280;font-size:13px}
</style>
</head>
<body>
<div class="nav">
  <h2>Profile</h2>
  <button class="nav-btn" onclick="goToDashboard()">← Dashboard</button>
</div>

<div id="loading" class="loading">Loading...</div>

<div id="content" style="display:none">
  <div class="card">
    <div class="user-info">
      <div class="avatar" id="avatarInit"></div>
      <div>
        <div class="user-name" id="userName"></div>
        <div class="user-email" id="userEmail"></div>
      </div>
    </div>

    <h3>Change Password</h3>
    <p class="subtle">Enter your current password and a new password</p>

    <div id="msg" class="msg"></div>

    <form id="changePwForm">
      <label for="currentPw">Current Password</label>
      <input id="currentPw" type="password" placeholder="Enter current password" required autocomplete="current-password">

      <label for="newPw">New Password</label>
      <input id="newPw" type="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">

      <label for="confirmPw">Confirm New Password</label>
      <input id="confirmPw" type="password" placeholder="Re-enter new password" required autocomplete="new-password">

      <button type="submit" class="btn" id="submitBtn">Change Password</button>
    </form>
  </div>
</div>

<script>
const API = 'https://exam.hiroshi.cloud/api';

// Get token from localStorage
function getAuth() {
  try {
    const stored = localStorage.getItem('auth-storage');
    if (!stored) return null;
    const parsed = JSON.parse(stored);
    return {
      token: parsed?.state?.token,
      user: parsed?.state?.user
    };
  } catch(e) { return null; }
}

const auth = getAuth();

// Redirect to login if not authenticated
if (!auth || !auth.token) {
  window.location.href = '/login';
}

async function loadProfile() {
  try {
    const res = await fetch(API + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + auth.token }
    });
    if (!res.ok) { window.location.href = '/login'; return; }
    const user = await res.json();
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('avatarInit').textContent = user.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  } catch(e) {
    document.getElementById('loading').textContent = 'Error loading profile. Please try again.';
  }
}
loadProfile();

function showMsg(type, text) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg msg-' + type;
  m.style.display = 'block';
}

// CHANGE PASSWORD
document.getElementById('changePwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('msg').style.display = 'none';
  
  const currentPw = document.getElementById('currentPw').value;
  const newPw = document.getElementById('newPw').value;
  const confirmPw = document.getElementById('confirmPw').value;

  if (newPw !== confirmPw) {
    showMsg('error', '❌ New passwords do not match');
    return;
  }
  if (newPw.length < 6) {
    showMsg('error', '❌ Password must be at least 6 characters');
    return;
  }
  if (newPw === currentPw) {
    showMsg('error', '❌ New password must be different from current password');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Changing...';

  try {
    const res = await fetch(API + '/auth/change-password', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + auth.token
      },
      body: JSON.stringify({
        current_password: currentPw,
        new_password: newPw
      })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('error', '❌ ' + (data.detail || 'Failed to change password'));
    } else {
      showMsg('success', '✅ Password changed successfully! You can now use your new password.');
      document.getElementById('currentPw').value = '';
      document.getElementById('newPw').value = '';
      document.getElementById('confirmPw').value = '';
    }
  } catch(err) {
    showMsg('error', '❌ Network error: ' + (err.message || 'Cannot connect'));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Change Password';
  }
});

function goToDashboard() {
  const u = auth.user;
  window.location.href = '/' + (u?.role || 'student');
}
</script>
</body>
</html>
