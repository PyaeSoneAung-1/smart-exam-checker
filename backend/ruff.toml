# Ruff configuration for CI (`ruff check app tests`).
# Deliberately focused on correctness and import hygiene rather than style
# rewrites, so the codebase stays Python 3.10-compatible.
target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI dependency defaults (Depends(...) in signatures)
    "SIM108", # ternary suggestions are not always clearer
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in test helpers
